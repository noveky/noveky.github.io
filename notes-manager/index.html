<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes Desk — Noveky</title>
    <style>
      :root { color: #171719; background: #fff; font-family: Georgia, 'Times New Roman', serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      .desk { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding: 24px 32px; border-bottom: 1px solid #dedee2; }
      .brand { display: flex; align-items: baseline; gap: 10px; }
      .mark { color: #4056a1; font-size: 24px; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 21px; font-weight: 500; }
      .subtle { color: #666872; font-size: 13px; }
      .workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; }
      aside { padding: 24px 0; border-right: 1px solid #dedee2; }
      .aside-head { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 16px; }
      .aside-head h2 { font-size: 14px; font-weight: 500; }
      .new-button, .save-button { color: #fff; background: #4056a1; border: 1px solid #4056a1; }
      .new-button { padding: 6px 10px; font-size: 12px; }
      .note-list { margin: 0; padding: 0; list-style: none; }
      .note-list button { width: 100%; display: block; padding: 13px 20px; color: inherit; background: transparent; border: 0; border-top: 1px solid #eeeeef; text-align: left; }
      .note-list button:hover, .note-list button.active { background: #f5f5f7; }
      .note-title { display: block; overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
      .note-meta { display: block; margin-top: 5px; color: #777983; font-size: 12px; }
      main { min-width: 0; overflow: auto; }
      .editor { width: min(100%, 980px); margin: 0 auto; padding: 42px 42px 80px; }
      .editor-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 34px; }
      .editor-top h2 { font-size: 32px; font-weight: 400; }
      .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
      .actions button { padding: 8px 12px; border: 1px solid #c9c9ce; background: #fff; font-size: 13px; }
      .actions .save-button { border-color: #4056a1; }
      .actions button:disabled { cursor: wait; opacity: .55; }
      .field-grid { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 20px; }
      label { display: grid; gap: 8px; margin-bottom: 20px; color: #555761; font-size: 12px; }
      input, textarea { width: 100%; color: #171719; background: #fff; border: 1px solid #c9c9ce; border-radius: 0; outline: none; }
      input { padding: 10px 11px; }
      textarea { min-height: 390px; resize: vertical; padding: 14px; line-height: 1.6; }
      input:focus, textarea:focus { border-color: #4056a1; box-shadow: 0 0 0 2px #dce1f4; }
      .draft { display: flex; align-items: center; grid-template-columns: auto 1fr; gap: 9px; margin: 0; padding-top: 28px; }
      .draft input { width: auto; }
      .body-label { margin-top: 4px; }
      .body-label span { display: flex; justify-content: space-between; }
      .preview { margin-top: 34px; padding-top: 26px; border-top: 1px solid #dedee2; }
      .preview h3 { margin: 0 0 18px; font-size: 13px; font-weight: 500; color: #666872; }
      .preview-body { max-width: 650px; font-size: 17px; line-height: 1.8; }
      .preview-body h1, .preview-body h2, .preview-body h3 { margin: 1.5em 0 .55em; font-weight: 400; }
      .preview-body h1 { font-size: 30px; }
      .preview-body h2 { font-size: 24px; }
      .preview-body h3 { font-size: 20px; }
      .preview-body p { margin: 0 0 1.3em; }
      .preview-body ul { margin-top: 0; padding-left: 1.3em; }
      .notice { min-height: 1.3em; margin-top: 10px; color: #4056a1; font-size: 13px; }
      .empty { padding: 20px; color: #777983; font-size: 13px; }
      @media (max-width: 760px) {
        header { padding: 18px 20px; }
        .workspace { grid-template-columns: 1fr; }
        aside { border-right: 0; border-bottom: 1px solid #dedee2; }
        .note-list { display: flex; overflow-x: auto; }
        .note-list li { min-width: 190px; }
        .note-list button { border-top: 0; border-right: 1px solid #eeeeef; }
        .editor { padding: 30px 20px 60px; }
        .editor-top { display: block; }
        .actions { justify-content: flex-start; margin-top: 18px; }
        .field-grid { grid-template-columns: 1fr; gap: 0; }
        .draft { padding-top: 0; }
      }
    </style>
  </head>
  <body>
    <div class="desk">
      <header>
        <div class="brand"><span class="mark" aria-hidden="true">Π</span><h1>Notes Desk</h1></div>
        <p class="subtle">Local editorial workspace</p>
      </header>
      <div class="workspace">
        <aside aria-label="Notes">
          <div class="aside-head"><h2>Notes</h2><button class="new-button" id="new-note" type="button">New note</button></div>
          <ul class="note-list" id="note-list"></ul>
        </aside>
        <main>
          <section class="editor" aria-labelledby="editor-title">
            <div class="editor-top">
              <div><h2 id="editor-title">Choose a note</h2><p class="notice" id="notice" role="status"></p></div>
              <div class="actions"><button id="delete-note" type="button" disabled>Delete</button><button id="save-note" class="save-button" type="button" disabled>Save note</button><button id="publish-note" type="button" disabled>Save &amp; rebuild</button></div>
            </div>
            <form id="note-form" hidden>
              <div class="field-grid">
                <label>Title<input id="title" name="title" required /></label>
                <label>Date<input id="date" name="date" type="date" required /></label>
              </div>
              <label>Slug<input id="slug" name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" /></label>
              <label>Summary<input id="dek" name="dek" required /></label>
              <label class="draft"><input id="draft" name="draft" type="checkbox" /> Keep this as a draft</label>
              <label class="body-label"><span>Markdown <small id="word-count">0 words</small></span><textarea id="body" name="body" required spellcheck="true"></textarea></label>
            </form>
            <section class="preview" id="preview" hidden><h3>Reading preview</h3><div class="preview-body" id="preview-body"></div></section>
          </section>
        </main>
      </div>
    </div>
    <script>
      const state = { notes: [], current: null, isNew: false }
      const $ = (id) => document.getElementById(id)
      const fields = ['title', 'slug', 'dek', 'date', 'draft', 'body']
      const buttons = [$('save-note'), $('publish-note'), $('delete-note')]

      function escapeHtml(value) { return value.replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])) }
      function previewMarkdown(value) {
        return value.trim().split(/\n\s*\n/).filter(Boolean).map((block) => {
          const text = escapeHtml(block.trim())
          if (text.startsWith('### ')) return '<h3>' + text.slice(4) + '</h3>'
          if (text.startsWith('## ')) return '<h2>' + text.slice(3) + '</h2>'
          if (text.startsWith('# ')) return '<h1>' + text.slice(2) + '</h1>'
          if (text.split('\n').every((line) => line.startsWith('- '))) return '<ul>' + text.split('\n').map((line) => '<li>' + line.slice(2) + '</li>').join('') + '</ul>'
          return '<p>' + text.replace(/\n/g, '<br>') + '</p>'
        }).join('')
      }
      function setNotice(message, error = false) { $('notice').textContent = message; $('notice').style.color = error ? '#9d3e34' : '#4056a1' }
      function setEditing(enabled) { $('note-form').hidden = !enabled; $('preview').hidden = !enabled; buttons.forEach((button) => { button.disabled = !enabled }) }
      function fill(note) {
        state.current = note.slug; state.isNew = false; setEditing(true)
        fields.forEach((field) => { $(field).value = note[field] ?? ''; if (field === 'draft') $(field).checked = note.draft })
        $('editor-title').textContent = note.title; updatePreview(); renderList(); setNotice('')
      }
      function blank() {
        state.current = null; state.isNew = true; setEditing(true)
        $('title').value = ''; $('slug').value = ''; $('dek').value = ''; $('date').value = new Date().toISOString().slice(0, 10); $('draft').checked = true; $('body').value = ''
        $('editor-title').textContent = 'New note'; updatePreview(); renderList(); setNotice('Draft — save when ready')
      }
      function renderList() {
        $('note-list').innerHTML = state.notes.length ? state.notes.map((note) => '<li><button class="' + (note.slug === state.current ? 'active' : '') + '" data-slug="' + note.slug + '"><span class="note-title">' + escapeHtml(note.title) + '</span><span class="note-meta">' + (note.draft ? 'Draft · ' : '') + note.date + '</span></button></li>').join('') : '<li class="empty">No notes yet.</li>'
        document.querySelectorAll('[data-slug]').forEach((button) => button.addEventListener('click', () => loadNote(button.dataset.slug)))
      }
      async function loadNotes() { const response = await fetch('/api/notes'); state.notes = await response.json(); renderList(); if (state.notes[0]) fill(state.notes[0]) }
      async function loadNote(slug) { const response = await fetch('/api/notes/' + encodeURIComponent(slug)); if (response.ok) fill(await response.json()) }
      function formData() { return { title: $('title').value.trim(), slug: $('slug').value.trim(), dek: $('dek').value.trim(), date: $('date').value, draft: $('draft').checked, body: $('body').value } }
      async function save(rebuild) {
        const data = formData(); if (!data.title || !data.slug || !data.dek || !data.date || !data.body.trim()) { setNotice('Title, summary, date, and body are required.', true); return }
        buttons.forEach((button) => { button.disabled = true }); setNotice(rebuild ? 'Saving and rebuilding…' : 'Saving…')
        const response = await fetch('/api/notes' + (state.isNew ? '' : '/' + encodeURIComponent(state.current)), { method: state.isNew ? 'POST' : 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
        if (!response.ok) { setNotice(await response.text(), true); setEditing(true); return }
        const note = await response.json(); state.isNew = false; state.current = note.slug
        if (rebuild) { const build = await fetch('/api/rebuild', { method: 'POST' }); if (!build.ok) { setNotice('Saved, but the site rebuild failed.', true); setEditing(true); return } }
        await loadNotes(); await loadNote(note.slug); setNotice(rebuild ? 'Saved and published locally.' : 'Saved.')
      }
      async function remove() { if (!state.current || !confirm('Delete this note?')) return; const response = await fetch('/api/notes/' + encodeURIComponent(state.current), { method: 'DELETE' }); if (!response.ok) { setNotice(await response.text(), true); return } state.current = null; await loadNotes(); if (!state.notes.length) { blank(); } setNotice('Note deleted.') }
      function updatePreview() { const body = $('body').value; $('word-count').textContent = (body.match(/\S+/g) || []).length + ' words'; $('preview-body').innerHTML = previewMarkdown(body) }
      $('new-note').addEventListener('click', blank); $('save-note').addEventListener('click', () => save(false)); $('publish-note').addEventListener('click', () => save(true)); $('delete-note').addEventListener('click', remove); $('body').addEventListener('input', updatePreview); $('title').addEventListener('input', () => { if (state.isNew && !$('slug').value) $('slug').value = $('title').value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') });
      loadNotes().catch((error) => setNotice(error.message, true))
    </script>
  </body>
</html>
